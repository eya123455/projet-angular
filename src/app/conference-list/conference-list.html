<main class="conference-page">
  <section class="conference-hero" aria-labelledby="conference-title">
    <div class="conference-hero-copy">
      <span class="eyebrow">Votre espace d’apprentissage</span>
      <h1 id="conference-title">Nos conférences <span aria-hidden="true">✨</span></h1>
      <p>Découvrez les prochains rendez-vous et trouvez l’inspiration pour la suite.</p>
    </div>
    <div class="conference-mark" aria-hidden="true">P</div>
  </section>

  <section class="conference-grid" aria-label="Conférences à venir">
    @for (conference of conferences; track conference.name) {
      <app-conference-details [conference]="conference" (increment)="inc()"></app-conference-details>
    }
  </section>
</main>
